<button type="button" class="account-trigger" [cdkMenuTriggerFor]="accountMenu" [attr.aria-label]="'Menu tài khoản' | t"><img [src]="avatar || '/assets/images/avatar.svg'" jmsImageFallback alt="" width="34" height="34"><span>{{ (name || 'Tài khoản') | t }}</span><i class="bi bi-chevron-down" aria-hidden="true"></i></button>
<ng-template #accountMenu><div cdkMenu class="account-popup jms-popup" [attr.aria-label]="'Tài khoản' | t">
  <header><span class="popup-eyebrow">{{ roleName }}</span><strong>{{ (name || 'Tài khoản JMS') | t }}</strong></header>
  <a cdkMenuItem [routerLink]="['/', userRole, 'profile']"><i class="bi bi-person-circle" aria-hidden="true"></i> {{ 'Thông tin cá nhân' | t }}</a>
  <a *ngIf="userRole === 'candidate'" cdkMenuItem routerLink="/candidate/change-password"><i class="bi bi-shield-lock" aria-hidden="true"></i> {{ 'Thay Đổi Mật Khẩu' | t }}</a>
  <a *ngIf="userRole === 'admin'" cdkMenuItem routerLink="/admin/setting"><i class="bi bi-sliders2" aria-hidden="true"></i> {{ 'Cài đặt JMS' | t }}</a>
  <button type="button" cdkMenuItem (cdkMenuItemTriggered)="signedOut.emit()" class="sign-out"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> {{ 'Đăng xuất' | t }}</button>
</div></ng-template>
