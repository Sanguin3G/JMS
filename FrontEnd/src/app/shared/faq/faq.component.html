<section class="faq-shell" aria-labelledby="faq-title">
<div class="faq-heading"><div><span class="eyebrow">JMS · Trợ giúp</span><h2 id="faq-title">Hiểu rõ hành trình tìm việc</h2></div><p>Hướng dẫn CV, ứng tuyển và matching từ nội dung được quản trị viên biên soạn.</p></div>
<div class="faq-tools"><label class="visually-hidden" for="faq-search">Tìm trợ giúp</label><input id="faq-search" type="search" [(ngModel)]="query" (keyup.enter)="search()" placeholder="CV, ứng tuyển hoặc matching"><button type="button" class="faq-button" (click)="search()" [disabled]="isLoading">Tìm</button></div>
<div class="faq-chat"><label class="visually-hidden" for="faq-question">Câu hỏi về JMS</label><input id="faq-question" type="text" [(ngModel)]="question" (keyup.enter)="ask()" maxlength="500" placeholder="Nhập câu hỏi ngắn"><button type="button" class="faq-button faq-button-accent" (click)="ask()" [disabled]="isAsking || !question.trim()">{{ isAsking ? 'Đang tìm…' : 'Tìm câu trả lời' }}</button></div>
<p *ngIf="answer" class="faq-answer"><strong>{{ answerSource }}:</strong> {{ answer }}</p>
<div class="faq-list" *ngIf="!isLoading; else faqLoading"><details *ngFor="let entry of entries"><summary>{{ entry.question }}</summary><p>{{ entry.answer }}</p></details><p *ngIf="entries.length === 0" class="faq-empty">Chưa có hướng dẫn phù hợp. Thử từ khóa khác.</p></div><ng-template #faqLoading><p class="faq-empty" role="status">Đang tải hướng dẫn…</p></ng-template>
</section>
