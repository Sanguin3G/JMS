<div class="container-fluid">
   <candidate-header></candidate-header>

   <form (ngSubmit)="submitCV()" class="cv-editor-form">
     <header class="editor-toolbar container"><div><a routerLink="/candidate/your-cvs"><i class="bi bi-arrow-left" aria-hidden="true"></i> Thư viện CV</a><h1>Chỉnh sửa CV</h1><p>Điền thông tin chính, bổ sung các mục phù hợp và chọn một trong 9 mẫu JMS.</p></div><div class="editor-save"><span *ngIf="hasUnsavedChanges()">Có thay đổi chưa lưu</span><button type="submit" class="btn btn-primary" [disabled]="isSaving || loading || !!loadError"><i class="bi bi-floppy" aria-hidden="true"></i> {{ isSaving ? 'Đang lưu…' : 'Lưu CV' }}</button></div></header>
     <div class="container"><p *ngIf="loading" class="editor-notice" role="status">Đang tải CV…</p><div *ngIf="loadError" class="editor-notice" role="alert"><p>{{ loadError }}</p><button type="button" class="btn btn-outline-primary" (click)="loadCv()">Thử lại</button></div><p *ngIf="savedMessage && !hasUnsavedChanges()" class="editor-notice" role="status">{{ savedMessage }}</p><div *ngIf="validationMessages.length" id="cv-validation" tabindex="-1" class="editor-validation" role="alert"><h2>Kiểm tra thông tin trước khi lưu</h2><ul><li *ngFor="let message of validationMessages">{{ message }}</li></ul></div></div>
     <fieldset [disabled]="isSaving" *ngIf="!loading && !loadError">
   <div class="container mb-5" [style.font-family]="fontCV">
      <div class="container Header">
         <div class="header__title">
            <input type="text" name="cvTitle" [(ngModel)]="form.cvTitle" class="header__input cvTitle" placeholder="Tên CV" aria-label="Tên CV">
         </div>
         <div class="header__title">
            <select name="categoryId" class="form-select shadow-none customSelect categoryId" [(ngModel)]="form.categoryId"
               aria-label="Ngành nghề">
               <option value="0"> Chọn Lĩnh Vực</option>
               <option *ngFor="let elm of categories" [value]="elm.id">{{elm.categoryName}}</option>
            </select>
         </div>

         <div class="header__title">
            <select name="levelId" class="form-select shadow-none customSelect levelId" [(ngModel)]="form.levelId"
               aria-label="Cấp bậc">
               <option value="0">Chọn Cấp Bậc</option>
               <option *ngFor="let elm of levels" [value]="elm.id">{{elm.title}}</option>
            </select>
         </div>

         <div class="header__title">
            <select name="employmentTypeId" class="form-select shadow-none customSelect employmentTypeId" [(ngModel)]="form.employmentTypeId"
               aria-label="Hình thức làm việc">
               <option value="0">Chọn Loại việc làm</option>
               <option *ngFor="let elm of employmentTypes" [value]="elm.id">{{elm.title}}</option>
            </select>
         </div>



         <div class="header__title">
            <select name="fontCV" class="form-select shadow-none customSelect1" [(ngModel)]="fontCV"
               aria-label="Phông chữ CV">
               <option value="Sans-serif">Sans-serif</option>
               <option value="Monospace">Monospace</option>
               <option value="Arial">Arial</option>
               <option value="Times New Roman">Times New Roman</option>
               <option value="Helvetica">Helvetica</option>
               <option value="Courier">Courier</option>
               <option value="Courier New">Courier New</option>
               <option value="Verdana">Verdana</option>
            </select>
         </div>
         <div class="block-BackGroundCV">

            <div style="margin: auto;">
               <i class="bi bi-image"></i>
               <span>Hình nền CV</span>
            </div>

            <div class="wrapModel">
               <div class="modelBackground">
                  <button type="button" class="items" (click)="selectTheme(0)" [attr.aria-pressed]="themeId === 0"><img src="/assets/images/themeDefault.jpg" alt="Mẫu 1"><span class="theme-caption">Mẫu 1</span></button>

                  <button type="button" class="items" (click)="selectTheme(1)" [attr.aria-pressed]="themeId === 1"><img src="/assets/images/theme1.jpg" alt="Mẫu 2"><span class="theme-caption">Mẫu 2</span></button>

                  <button type="button" class="items" (click)="selectTheme(2)" [attr.aria-pressed]="themeId === 2"><img src="/assets/images/theme2.jpg" alt="Mẫu 3"><span class="theme-caption">Mẫu 3</span></button>

                  <button type="button" class="items" (click)="selectTheme(3)" [attr.aria-pressed]="themeId === 3"><img src="/assets/images/theme3.jpg" alt="Mẫu 4"><span class="theme-caption">Mẫu 4</span></button>

                  <button type="button" class="items" (click)="selectTheme(4)" [attr.aria-pressed]="themeId === 4"><img src="/assets/images/theme4.jpg" alt="Mẫu 5"><span class="theme-caption">Mẫu 5</span></button>

                  <button type="button" class="items" (click)="selectTheme(5)" [attr.aria-pressed]="themeId === 5"><img src="/assets/images/theme5.jpg" alt="Mẫu 6"><span class="theme-caption">Mẫu 6</span></button>

                  <button type="button" class="items" (click)="selectTheme(6)" [attr.aria-pressed]="themeId === 6"><img src="/assets/images/theme6.jpg" alt="Mẫu 7"><span class="theme-caption">Mẫu 7</span></button>

                  <button type="button" class="items" (click)="selectTheme(7)" [attr.aria-pressed]="themeId === 7"><img src="/assets/images/theme7.jpg" alt="Mẫu 8"><span class="theme-caption">Mẫu 8</span></button>

                  <button type="button" class="items" (click)="selectTheme(8)" [attr.aria-pressed]="themeId === 8"><img src="/assets/images/theme8.jpg" alt="Mẫu 9"><span class="theme-caption">Mẫu 9</span></button>
               </div>
            </div>
         </div>
      </div>

      <div class="conten-detail-cv">
         <div class="col-4 p-3 block-left" [style.background-image]="'url('+ backgroundSelectedLink + ')'">
            <div class="avatar-candidate">
               <div class="file-upload">
                  <div class="image-upload-wrap" ng-hide="true" [style.display]="hideImage">
                     <input #avatarInput class="file-upload-input" type='file' id="avatarCv" aria-label="Ảnh đại diện CV (PNG, JPEG hoặc WebP, tối đa 5 MB)"
                        (change)="getFile($event);" accept="image/png,image/jpeg,image/webp" />
                     <div class="drag-text">
                        <h3 [class]="ThemStyle">Kéo thả ảnh hoặc chọn ảnh</h3>
                     </div>
                  </div>
                  <div class="file-upload-content" [style.display]="displayImage">
                     <img class="file-upload-image" [src]="fileSrc" alt="Ảnh đại diện CV" jmsImageFallback />
                     <div class="btn-Change-Image">
                        <button type="button" class="bi bi-plus-lg file-upload-btn" (click)="chooseAvatar()"
                           aria-label="Chọn ảnh đại diện khác"
                           [style.display]="displayChange"></button>
                     </div>
                  </div>
               </div>
            </div>

            <div class="mt-3 form-info form-input-value">

               <div>
                  <input type="text" placeholder="Thông tin cá nhân" value="Thông tin cá nhân" disabled
                     class="form-left--header width100" [style.color]="colorLeftHeader" [class]="ThemStyle">
               </div>

               <div class="mt-1">
                  <i class="bi bi-envelope" [style.color]="colorLeftHeader"></i>
                  <input type="email" name="displayEmail" [(ngModel)]="form.displayEmail" placeholder="Email"
                     class="form-info-input inputEmail" [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Email liên hệ">
               </div>

               <div class="mt-1">
                  <i class="bi bi-telephone" [style.color]="colorLeftHeader"></i>
                  <input type="tel" name="phone" [(ngModel)]="form.phone" placeholder="Số điện thoại" class="form-info-input inputPhone"
                     [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Số điện thoại">
               </div>

               <div class="mt-1">
                  <i class="bi bi-calendar" [style.color]="colorLeftHeader"></i>
                  <input type="date" name="dob" [(ngModel)]="form.dob" class="form-info-input inputDob"
                     [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Ngày sinh">
               </div>

               <div class="d-flex mt-2">
                  <i class="bi bi-gender-ambiguous" [style.color]="colorLeftHeader"></i>
                  <div class="d-flex">
                     <div class="form-check ml-2">
                        <input class="form-check-input shadow-none" [style.color]="colorLeftInput" value="1"
                           [(ngModel)]="form.gender" type="radio" name="gender" id="nam" aria-label="Giới tính">
                        <label class="form-check-label" for="nam" [style.color]="colorLeftHeader">
                           Nam
                        </label>
                     </div>
                     <div class="form-check  ml-2">
                        <input class="form-check-input shadow-none" [style.color]="colorLeftHeader" value="2"
                           [(ngModel)]="form.gender" type="radio" name="gender" id="nu" aria-label="Giới tính">
                        <label class="form-check-label" for="nu" [style.color]="colorLeftHeader">
                           Nữ
                        </label>
                     </div>
                  </div>
               </div>

               <div class="mt-1 d-flex">
                  <i class="bi bi-geo-alt" [style.color]="colorLeftHeader"></i>
                  <textarea rows="2" name="address" [(ngModel)]="form.address" maxlength="60" placeholder="Địa chỉ" class="form-info-input inputAddress"
                     [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Địa chỉ"></textarea>
               </div>
            </div>


            <div class="mt-3 form-skills form-input-value">

               <div>
                  <input type="text" placeholder="Kỹ năng" value="Kỹ năng" disabled class="form-left--header width100"
                     [style.color]="colorLeftHeader">
               </div>

               <div class="skill">




                  <div class="mt-1">
                     <div *ngFor="let sk of skills; let index = index; trackBy: trackByIndex">
                        <textarea rows="3" [name]="'skill-' + index" [(ngModel)]="sk.skillDescription" maxlength="300" placeholder="Mô tả kỹ năng"
                           class="form-info-input inputDescripitonSkills skillDescription"
                           [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Mô tả kỹ năng"></textarea>
                     </div>

                  </div>
               </div>

               <button type="button" class="bi bi-plus-lg skillAdd" (click)="addSkill()" aria-label="Thêm kỹ năng"></button>
               <button type="button" class="bi bi-dash skillSub" (click)="removeSkill(skills.length - 1)" aria-label="Xóa kỹ năng"></button>
            </div>


            <div class="mt-3 form-Certificates form-input-value">

               <div>
                  <input type="text" placeholder="Chứng chỉ" value="Tên chứng chỉ" disabled
                     class="form-left--header width100" [style.color]="colorLeftHeader" [class]="ThemStyle">
               </div>

               <div class="certificates" *ngFor="let ce of certificates; let index = index; trackBy: trackByIndex">

                  <div class="mt-1">
                     <input type="text" [name]="'certificate-name-' + index" [(ngModel)]="ce.certificateName" placeholder="Tên chứng chỉ"
                        class="form-info-input certificateName" [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Tên chứng chỉ">
                  </div>


                  <div class="mt-1 d-flex">
                     <input type="text" [name]="'certificate-issued-' + index" [(ngModel)]="ce.issuedDate" placeholder="mm/yyyy" class="form-info-input width50 issuedDateCertificate"
                        [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Ngày cấp chứng chỉ">
                     <div>-</div>
                     <input type="text" [name]="'certificate-expired-' + index" [(ngModel)]="ce.expiredDate" placeholder="mm/yyyy" class="form-info-input width50 expiredDateCertificate"
                        [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Ngày hết hạn chứng chỉ">
                  </div>


                  <div class="mt-1">
                     <input type="url" [name]="'certificate-url-' + index" [(ngModel)]="ce.credentialURL" placeholder="Link" class="form-info-input width50 credentialURLCertificate"
                        [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Liên kết chứng chỉ">
                  </div>


                  <div class="mt-1">
                     <textarea rows="3" [name]="'certificate-provider-' + index" [(ngModel)]="ce.certificateProvider" maxlength="300" placeholder="Miêu tả"
                        class="form-info-input certificateProvider" [style.color]="colorLeftInput"
                        [class]="ThemStyle" aria-label="Đơn vị cấp chứng chỉ"></textarea>
                  </div>
               </div>
               <button type="button" class="bi bi-plus-lg certificatesAdd" (click)="addCertificate()" aria-label="Thêm chứng chỉ"></button>
               <button type="button" class="bi bi-dash certificatesSub" (click)="removeCertificate(certificates.length - 1)" aria-label="Xóa chứng chỉ"></button>
            </div>


            <div class="mt-3 form-prizes form-input-value">

               <div>
                  <input type="text" placeholder="Giải thưởng" value="Giải thưởng" disabled
                     class="form-left--header width100" [style.color]="colorLeftHeader">
               </div>

               <div class="prizes" *ngFor="let aw of awards; let index = index; trackBy: trackByIndex">

                  <div class="mt-1">
                     <input type="text" [name]="'award-year-' + index" [(ngModel)]="aw.fromYear" placeholder="Thời gian"
                        class="form-info-input fromYearAwards" [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Thời gian bắt đầu">
                  </div>


                  <div class="mt-1">
                     <input type="text" [name]="'award-name-' + index" [(ngModel)]="aw.awardName" placeholder="Tên giải thưởng"
                        class="form-info-input awardName" [style.color]="colorLeftInput" [class]="ThemStyle" aria-label="Tên giải thưởng">
                  </div>


                  <div class="mt-1">
                     <textarea rows="3" [name]="'award-description-' + index" [(ngModel)]="aw.description" maxlength="300" placeholder="Miêu tả"
                        class="form-info-input awardDescription" [style.color]="colorLeftInput"
                        [class]="ThemStyle" aria-label="Mô tả"></textarea>
                  </div>
               </div>
               <button type="button" class="bi bi-plus-lg prizesAdd" (click)="addAward()" aria-label="Thêm giải thưởng"></button>
               <button type="button" class="bi bi-dash prizesSub" (click)="removeAward(awards.length - 1)" aria-label="Xóa giải thưởng"></button>
            </div>
         </div>

         <div class="col-8 p-4 block-right">


            <div class="form-position form-input-value">

               <div style="display: flex;">
                  <div style="line-height: 40px; font-weight: 600; font-size: 21px; white-space: pre;">Họ và tên:
                  </div>
                  <div>

                     <input type="text" name="displayName" [(ngModel)]="form.displayName" placeholder="Họ và tên"
                        class="form-right--header mt-2 displayName" [style.color]="colorRightHeader"
                        [class]="ThemStyle" aria-label="Họ và tên">
                  </div>
               </div>




            </div>


            <div class="mt-3 form-target form-input-value">

               <div>
                  <input type="text" placeholder="Mục tiêu nghề nghiệp" value="Mục tiêu nghề nghiệp" disabled
                     class="form-right--header mt-2" [style.color]="colorRightHeader" [class]="ThemStyle">
               </div>


               <div class="mt-1">
                  <textarea rows="3" name="careerGoal" [(ngModel)]="form.careerGoal" maxlength="300"
                     placeholder="mục tiêu nghề nghiệp của bạn, bao gồm mục tiêu ngắn và dài hạn"
                     class="input-side-right mt-2 careerGoal" [style.color]="colorRightHeader"
                     [class]="ThemStyle" aria-label="Mục tiêu nghề nghiệp"></textarea>
               </div>
            </div>


            <div class="mt-3 form-experience form-input-value">

               <div>
                  <input type="text" placeholder="Kinh nghiệm việc làm" value="Kinh nghiệm việc làm" disabled
                     class="form-right--header mt-2" [style.color]="colorRightHeader" [class]="ThemStyle">
               </div>

               <div class="experience" *ngFor="let ex of experiences; let index = index; trackBy: trackByIndex">

                  <div class="mt-1">
                     <i class="bi bi-briefcase"></i>
                     <input type="text" [name]="'experience-position-' + index" [(ngModel)]="ex.position" placeholder="Vị trí công việc"
                        class="form-info-input-right mt-2 positionOfCompany" [style.color]="colorRightHeader"
                        [class]="ThemStyle" aria-label="Vị trí làm việc">
                     <span>//</span>
                     <input type="text" [name]="'experience-from-' + index" [(ngModel)]="ex.fromDate" placeholder="mm/yyyy"
                        class="form-info-input-Right-Date mt-2 fromDateExperience" [class]="ThemStyle" aria-label="Tháng bắt đầu (mm/yyyy)">
                     <span>-</span>
                     <input type="text" [name]="'experience-to-' + index" [(ngModel)]="ex.toDate" placeholder="mm/yyyy"
                        class="form-info-input-Right-Date mt-2 toDateExperience" [class]="ThemStyle" aria-label="Tháng kết thúc (mm/yyyy)">
                  </div>

                  <div>
                     <input type="text" [name]="'experience-company-' + index" [(ngModel)]="ex.ComapanyName" placeholder="Tên công ty "
                        class="form-info-input-right mt-2 width100 companyName" [class]="ThemStyle" aria-label="Tên công ty">
                  </div>

                  <div>
                     <textarea rows="4" [name]="'experience-description-' + index" [(ngModel)]="ex.description" maxlength="600" placeholder="Mô tả kinh nghiệm việc làm của bạn"
                        class="form-info-input-right width100 mt-2 experienceDescription"
                        [class]="ThemStyle" aria-label="Mô tả"></textarea>
                  </div>
               </div>
               <button type="button" class="bi bi-plus-lg form-experienceAdd" (click)="addExperience()" aria-label="Thêm kinh nghiệm"></button>
               <button type="button" class="bi bi-dash form-experienceSub" (click)="removeExperience(experiences.length - 1)" aria-label="Xóa kinh nghiệm"></button>
            </div>


            <div class="mt-3 form-project form-input-value">

               <div>
                  <input type="text" placeholder="Dự án" value="Dự án" disabled class="form-right--header mt-2"
                     [style.color]="colorRightHeader">
               </div>

               <div class="project" *ngFor="let pr of projects; let index = index; trackBy: trackByIndex">

                  <div class="mt-1">
                     <i class="bi bi-diagram-3" [style.color]="colorRightHeader"></i>
                     <input type="text" [name]="'project-name-' + index" [(ngModel)]="pr.projectName" placeholder="Tên dự án"
                        class="form-info-input-right mt-2 projectName" [class]="ThemStyle" aria-label="Tên dự án">
                     <span>//</span>
                     <input type="text" [name]="'project-from-' + index" [(ngModel)]="pr.fromDate" placeholder="mm/yyyy"
                        class="form-info-input-Right-Date mt-2 fromDateProject" [class]="ThemStyle" aria-label="Tháng bắt đầu (mm/yyyy)">
                     <span>-</span>
                     <input type="text" [name]="'project-to-' + index" [(ngModel)]="pr.toDate" placeholder="mm/yyyy"
                        class="form-info-input-Right-Date mt-2 toDateProject" [class]="ThemStyle" aria-label="Tháng kết thúc (mm/yyyy)">
                  </div>
                  <div>
                     <div class="form-check ">
                        <input class="form-check-input shadow-none isStillWorking" [name]="'project-current-' + index" [(ngModel)]="pr.isStillWorking" type="checkbox" aria-label="Đang thực hiện dự án">
                        <label class="form-check-label">
                           Đang làm việc
                        </label>
                     </div>
                  </div>
                  <div>
                     <textarea rows="3" [name]="'project-description-' + index" [(ngModel)]="pr.description" maxlength="300" placeholder="Mô tả kinh nghiệm trong dự án của bạn"
                        class="form-info-input-right width100 mt-2 projectDescription"
                        [class]="ThemStyle" aria-label="Mô tả"></textarea>
                  </div>
               </div>

               <button type="button" class="bi bi-plus-lg form-projectAdd" (click)="addProject()" aria-label="Thêm dự án"></button>
               <button type="button" class="bi bi-dash form-projectSub" (click)="removeProject(projects.length - 1)" aria-label="Xóa dự án"></button>
            </div>


            <div class="mt-3 form-education form-input-value">

               <div>
                  <input type="text" placeholder="Học vấn" value="Học vấn" disabled class="form-right--header mt-2"
                     [style.color]="colorRightHeader">
               </div>

               <div class="education" *ngFor="let ed of educations; let index = index; trackBy: trackByIndex">

                  <div class="mt-1">
                     <i class="bi bi-mortarboard" [style.color]="colorRightHeader"></i>
                     <input type="text" [name]="'education-major-' + index" [(ngModel)]="ed.majorName" placeholder="Ngành học - môn học "
                        class="form-info-input-right mt-2 majorName" [class]="ThemStyle" aria-label="Ngành học">
                     <span>//</span>
                     <input type="text" [name]="'education-from-' + index" [(ngModel)]="ed.fromYear" placeholder="mm/yyyy"
                        class="form-info-input-Right-Date mt-2 fromYearEducation" [class]="ThemStyle" aria-label="Thời gian bắt đầu">
                     <span>-</span>
                     <input type="text" [name]="'education-to-' + index" [(ngModel)]="ed.toYear" placeholder="mm/yyyy"
                        class="form-info-input-Right-Date mt-2 toYearEducation" [class]="ThemStyle" aria-label="Thời gian kết thúc">
                  </div>

                  <div>
                     <input type="text" [name]="'education-school-' + index" [(ngModel)]="ed.schoolName" placeholder="Tên trường học"
                        class="form-info-input-right mt-2 schoolName width100" [class]="ThemStyle" aria-label="Tên trường">
                  </div>
                  <div>
                     <div class="form-check ">
                        <input type="checkbox" [name]="'education-current-' + index" [(ngModel)]="ed.stillLearning" class="form-check-input shadow-none stillLearning" aria-label="Đang học tập">
                        <label class="form-check-label">
                           Đang học tập
                        </label>
                     </div>
                  </div>

                  <div>
                     <textarea rows="3" [name]="'education-description-' + index" [(ngModel)]="ed.description" maxlength="300" placeholder="Mô tả quá trình học tập hoặc thành tích của bạn"
                        class="form-info-input-right width100 mt-2 educationDescription" [class]="ThemStyle" aria-label="Mô tả"></textarea>
                  </div>
               </div>

               <button type="button" class="bi bi-plus-lg form-educationAdd" (click)="addEducation()" aria-label="Thêm học vấn"></button>
               <button type="button" class="bi bi-dash form-educationSub" (click)="removeEducation(educations.length - 1)" aria-label="Xóa học vấn"></button>
            </div>
         </div>

      </div>

   </div>
   </fieldset>
   </form>
</div>
