<candidate-header></candidate-header>
<main class="saved-jobs container" aria-labelledby="saved-jobs-title"><header><div><p>JMS · Việc làm của bạn</p><h1 id="saved-jobs-title">Việc làm đã lưu</h1><p>Lưu những cơ hội đáng quan tâm để xem lại và ứng tuyển sau.</p></div><a class="btn btn-outline-primary" routerLink="/candidate">Khám phá việc làm</a></header><p *ngIf="loading" class="state" role="status">Đang tải việc làm đã lưu…</p><div *ngIf="error" class="state" role="alert"><p>{{ error }}</p><button type="button" class="btn btn-outline-primary" (click)="load()">Thử lại</button></div><div *ngIf="!loading && !error && !jobs.length" class="state"><i class="bi bi-bookmark" aria-hidden="true"></i><h2>Chưa có việc làm đã lưu</h2><p>Chọn nút Lưu trên công việc bạn quan tâm.</p><a class="btn btn-primary" routerLink="/candidate">Tìm việc làm</a></div><div *ngIf="!loading && !error" class="job-grid"><app-job-card *ngFor="let job of jobs" [job]="job" [canSave]="true" [saved]="true" [saving]="savedJobs.pendingIds().has(job.jobId)" (saveToggle)="unsave($event)"></app-job-card></div><app-jms-pagination [page]="page" [pageSize]="pageSize" [total]="total" [loading]="loading" (pageChange)="changePage($event)"></app-jms-pagination></main>
