<div class="container">
   <section class="carousel mt-3" aria-roledescription="carousel" aria-label="Featured companies">
      <div class="carousel-indicators" role="tablist" aria-label="Choose featured company">
         <button *ngFor="let slide of slides; index as index" type="button" class="carousel-indicator"
            [class.active]="activeSlide === index" [attr.aria-label]="'Show featured company ' + (index + 1)"
            [attr.aria-selected]="activeSlide === index" (click)="selectSlide(index)"></button>
      </div>
      <div class="carousel-inner">
         <div *ngFor="let slide of slides; index as index" class="carousel-item" [class.active]="activeSlide === index"
            [attr.aria-hidden]="activeSlide !== index">
            <img [src]="slide.url" class="d-block w-100" [alt]="slide.title"
               [attr.fetchpriority]="index === 0 ? 'high' : 'low'" [attr.loading]="index === 0 ? null : 'lazy'">
         </div>
      </div>
      <button class="carousel-control-prev" type="button" (click)="previousSlide()" aria-label="Previous featured company">
         <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" (click)="nextSlide()" aria-label="Next featured company">
         <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
   </section>

   <section class="mt-5">
      <div class="textHeader1">Danh sách công ty</div>
      <div id="menu">
         <div class="carousel-nav">
            <button type="button" class="carousel-scroll previous" (click)="scrollCompanies(-1)" aria-label="Previous companies">
               <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button type="button" class="carousel-scroll next" (click)="scrollCompanies(1)" aria-label="Next companies">
               <i class="fa-solid fa-chevron-right"></i>
            </button>
         </div>
         <ul #companyScroller class="cards-scroller">
            <div *ngIf="!companies" style="height: 400px;">
               <app-view-loading></app-view-loading>
            </div>
            <li id="box1" class="list" *ngFor="let com of companies">
               <a href="/candidate/company-detail/{{com?.companyId}}" style="text-decoration: none;">
                  <div class="imageSize">
                     <img src="{{ com?.avatarURL }}" alt="...">

                  </div>
                  <div class="titleCompany">{{ com?.companyName }}</div>
               </a>

            </li>

         </ul>
      </div>
   </section>
</div>
