<div class="container-fluid">
   <candidate-header></candidate-header>
   <div class="container header__container">
      <div class="formUpdate">
         <section>
            <h5>{{ 'Chỉnh sửa thông tin cá nhân' | t }}</h5>
            <div class="avatar">
               <img src="{{ profile?.avatarURL }}" jmsImageFallback
                  alt="">
               <div class="blockCamera" id="blockCamera">
                  <label for="avatarCv" class="iconCamera">
                     <i class="bi bi-camera" style="margin-top: 15px;"></i>
                  </label>
                  <input class="file-upload-input" style="display: none;" type='file' id="avatarCv" multiple=false
                     (change)="getFile($event);" />
               </div>
            </div>


            <div class="form-label-group mb-4 mt-3">
               <label class="form-label" for="username">{{ 'Tên đăng nhập' | t }}</label>
               <input type="text" disabled value="{{ profile?.userName }}" name="username"
                  class="form-control form-control-md shadow-none" />
            </div>


            <div class="form-label-group mb-4 mt-3">
               <label class="form-label" for="form3Example3">Email</label>
               <input type="email" disabled value="{{ profile?.email }}" name="email"
                  class="form-control form-control-md shadow-none" />
            </div>


            <div class="form-label-group mb-4 mt-3">
               <label class="form-label" for="form3Example3">{{ 'Họ và tên' | t }}</label><span class="link-danger"> *</span>
               <input type="text" name="fullName" value="{{ profile?.fullName }}" [(ngModel)]="FullName"
                  (ngModelChange)="validateFullName($event)" class="form-control form-control-md shadow-none" />
               <span *ngIf="invalidFullName" class="link-danger">
                  {{ 'Tên không hợp lệ' | t }}
               </span>
            </div>


            <div class="form-label-group mb-4 mt-3">
               <label class="form-label" for="form3Example3">{{ 'Số điện thoại' | t }}</label><span class="link-danger"> *</span>
               <input type="text" name="phone" value="{{ profile?.phoneNumber }}" [(ngModel)]="Phone"
                  (ngModelChange)="validatePhone($event)" class="form-control form-control-md shadow-none" />
               <span *ngIf="invalidPhone" class="link-danger">
                  {{ 'Số điện thoại không hợp lệ' | t }}
               </span>
            </div>


            <div class="form-label-group mb-4 mt-3">
               <label class="form-label" for="form3Example3">{{ 'Ngày sinh' | t }}</label><span class="link-danger"> *</span>
               <input type="date" name="fullName" (ngModelChange)="validateDob($event)" [(ngModel)]="Dob"
                  value="{{ profile?.dob.split('T')[0] }}" class="form-control form-control-md shadow-none" />
               <span *ngIf="invalidDob" class="link-danger">
                  {{ 'Ngày sinh không hợp lệ' | t }}
               </span>
            </div>

            <div class="d-flex">
               <div class="form-check ml-2">
                  <input class="form-check-input shadow-none" [(ngModel)]="genderId" type="radio"
                     name="gender" value="1" id="nam">
                  <label class="form-check-label" for="nam">
                     {{ 'Nam' | t }}
                  </label>
               </div>
               <div class="form-check  ml-2">
                  <input class="form-check-input shadow-none" [(ngModel)]="genderId" type="radio"
                     name="gender" value="2" id="nu">
                  <label class="form-check-label" for="nu">
                     {{ 'Nữ' | t }}
                  </label>
               </div>
            </div>

            <div class="col-12 p-0 mt-5">
               <button type="button" class="btn btnBlueLight btn-block" (click)="SubmitForm()">{{ 'Thay đổi' | t }}</button>
            </div>
         </section>
      </div>

   </div>
</div>
