<main class="admin-job"><a class="back-link" routerLink="/admin/company-page"><i class="bi bi-arrow-left" aria-hidden="true"></i> {{'Quản lý công ty' | t}}</a><p *ngIf="loading" role="status">{{'Đang tải tin tuyển dụng…' | t}}</p><p *ngIf="error" role="alert">{{error | t}}</p><ng-container *ngIf="jdDetail as job"><header><p class="eyebrow">{{'Quản trị · Tin tuyển dụng' | t}}</p><h1>{{job.title}}</h1><p>{{job.companyName || job.companyDTO?.companyName}}</p><small>{{'Ngày đăng' | t}}: {{job.createdAt}}</small></header><jms-job-document [job]="job"></jms-job-document></ng-container></main>
